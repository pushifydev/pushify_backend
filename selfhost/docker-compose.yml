# Pushify self-host stack — control plane (API + worker + dashboard) plus Postgres and Redis.
#
# Layout expected by install.sh (this file sits next to the two checkouts):
#   pushify/
#   ├── docker-compose.yml   <- this file
#   ├── .env                 <- generated by install.sh (secrets + URLs)
#   ├── pushify_backend/
#   └── pushify_frontend/
#
# After the stack is up, add a deploy server in the dashboard (Servers → Add existing server —
# it can be this same machine via SSH). App builds, nginx and SSL all run on that server; the
# control plane itself never needs Docker or nginx access on this host.

name: pushify

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pushify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: pushify
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pushify -d pushify']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build: ./pushify_backend
    command: ['node', 'dist/migrate.js']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://pushify:${POSTGRES_PASSWORD}@postgres:5432/pushify
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./pushify_backend
    restart: unless-stopped
    environment: &backend-env
      NODE_ENV: production
      PROCESS_ROLE: api
      PORT: '4000'
      DATABASE_URL: postgres://pushify:${POSTGRES_PASSWORD}@postgres:5432/pushify
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in .env}
      FRONTEND_URL: ${PUSHIFY_FRONTEND_URL}
      CORS_ORIGIN: ${PUSHIFY_FRONTEND_URL}
      API_BASE_URL: ${PUSHIFY_API_URL}
      # Behind your own reverse proxy? Set to the number of proxy hops so client IPs
      # (rate limiting, sessions) are derived from X-Forwarded-For correctly.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # Optional integrations — leave empty to disable (see pushify_backend/.env.example)
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - '${PUSHIFY_API_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:4000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: ./pushify_backend
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    environment:
      <<: *backend-env
      PROCESS_ROLE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./pushify_frontend
      args:
        # Baked into the client bundle at build time — rebuild after changing it.
        NEXT_PUBLIC_API_URL: ${PUSHIFY_API_URL}/api/v1
    restart: unless-stopped
    ports:
      - '${PUSHIFY_FRONTEND_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
